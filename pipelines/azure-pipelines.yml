trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: epp-terraform-backend-dev

stages:
  - stage: Validate
    displayName: Validate Terraform
    jobs:
      - job: Validate
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.17.1'
          - bash: |
              set -euo pipefail
              terraform -chdir=terraform fmt -check -recursive
              terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
              terraform -chdir=terraform validate
            displayName: Format and validate

  - stage: Plan
    displayName: Plan Terraform
    dependsOn: Validate
    jobs:
      - job: Plan
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.17.1'
          - task: AzureCLI@2
            displayName: Initialize backend and create plan
            inputs:
              azureSubscription: sc-epp-dev
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                : "${TFSTATE_RESOURCE_GROUP:?Set tfstateResourceGroup in epp-terraform-backend-dev}"
                : "${TFSTATE_STORAGE_ACCOUNT:?Set tfstateStorageAccount in epp-terraform-backend-dev}"
                : "${TFSTATE_CONTAINER:?Set tfstateContainer in epp-terraform-backend-dev}"
                : "${TFSTATE_KEY:?Set tfstateKey in epp-terraform-backend-dev}"

                export ARM_USE_CLI=true
                export ARM_SUBSCRIPTION_ID
                ARM_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"

                terraform -chdir=terraform init \
                  -input=false \
                  -lockfile=readonly \
                  -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP}" \
                  -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
                  -backend-config="container_name=${TFSTATE_CONTAINER}" \
                  -backend-config="key=${TFSTATE_KEY}" \
                  -backend-config="use_azuread_auth=true"
                mkdir -p "$(Build.ArtifactStagingDirectory)"
                terraform -chdir=terraform plan \
                  -input=false \
                  -out="$(Build.ArtifactStagingDirectory)/tfplan"
            env:
              TFSTATE_RESOURCE_GROUP: $(tfstateResourceGroup)
              TFSTATE_STORAGE_ACCOUNT: $(tfstateStorageAccount)
              TFSTATE_CONTAINER: $(tfstateContainer)
              TFSTATE_KEY: $(tfstateKey)
          - publish: $(Build.ArtifactStagingDirectory)/tfplan
            artifact: terraform-plan
            displayName: Publish Terraform plan

  - stage: Apply
    displayName: Apply Terraform
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Apply
        displayName: Apply approved plan
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: '1.17.1'
                - download: current
                  artifact: terraform-plan
                  displayName: Download Terraform plan
                - task: AzureCLI@2
                  displayName: Apply Terraform plan
                  inputs:
                    azureSubscription: sc-epp-dev
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      : "${TFSTATE_RESOURCE_GROUP:?Set tfstateResourceGroup in epp-terraform-backend-dev}"
                      : "${TFSTATE_STORAGE_ACCOUNT:?Set tfstateStorageAccount in epp-terraform-backend-dev}"
                      : "${TFSTATE_CONTAINER:?Set tfstateContainer in epp-terraform-backend-dev}"
                      : "${TFSTATE_KEY:?Set tfstateKey in epp-terraform-backend-dev}"

                      export ARM_USE_CLI=true
                      export ARM_SUBSCRIPTION_ID
                      ARM_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"

                      terraform -chdir=terraform init \
                        -input=false \
                        -lockfile=readonly \
                        -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP}" \
                        -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
                        -backend-config="container_name=${TFSTATE_CONTAINER}" \
                        -backend-config="key=${TFSTATE_KEY}" \
                        -backend-config="use_azuread_auth=true"
                      terraform -chdir=terraform apply \
                        -input=false \
                        -auto-approve \
                        "$(Pipeline.Workspace)/terraform-plan/tfplan"
                  env:
                    TFSTATE_RESOURCE_GROUP: $(tfstateResourceGroup)
                    TFSTATE_STORAGE_ACCOUNT: $(tfstateStorageAccount)
                    TFSTATE_CONTAINER: $(tfstateContainer)
                    TFSTATE_KEY: $(tfstateKey)
